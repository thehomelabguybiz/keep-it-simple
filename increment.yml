---
- name: Read, Increment, and Push back to GitHub via SSH
  hosts: all
  become: yes
  vars:
    repo_dir: "/opt/auto_increment_repo"
    file_name: "number.txt"
    # Notice the SSH URL instead of HTTPS
    git_repo_url: "git@github.com:thehomelabguybiz/keep-it-simple.git"
    
  tasks:
    - name: Ensure git is installed on the server
      apt:
        name: git
        state: present

    - name: Add GitHub to known_hosts to prevent SSH prompt freezing
      known_hosts:
        path: /root/.ssh/known_hosts
        name: github.com
        # This automatically fetches GitHub's public fingerprint
        key: "{{ lookup('pipe', 'ssh-keyscan github.com') }}"
        state: present

    - name: Clone the repository to the server
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: yes
        accept_hostkey: yes

    - name: Read the current number from the file
      command: cat "{{ repo_dir }}/{{ file_name }}"
      register: current_number
      ignore_errors: yes

    - name: Set current value (Defaults to 0 if file is empty or missing)
      set_fact:
        current_val: "{{ current_number.stdout | trim | default('0', true) }}"

    - name: Add +1 to the number
      set_fact:
        new_val: "{{ current_val | int + 1 }}"

    - name: Write the new number to the file
      copy:
        dest: "{{ repo_dir }}/{{ file_name }}"
        content: "{{ new_val }}"

    - name: Commit and push the updated file back to GitHub
      shell: |
        git config user.email "semaphore@homelab"
        git config user.name "Semaphore Bot"
        git add {{ file_name }}
        git commit -m "Auto-incremented to {{ new_val }}"
        git push origin main
      args:
        chdir: "{{ repo_dir }}"
      ignore_errors: yes
